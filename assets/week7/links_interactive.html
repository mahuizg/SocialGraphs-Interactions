k","Quasar (character)",2,2,2,"These formidable powers played a crucial role in his triumph over both\u003cbr\u003eQuasar and Silver Surfer on one occasion.",0.9996299743652344],["Adam Warlock","Star-Lord",2,2,6,"After time resumes, Star-Lord notices that Gamora is gone as Adam sent\u003cbr\u003eher to a location so that she can redeem herself.",-0.999559223651886],["Agent X (Marvel Comics)","Bob, Agent of Hydra",5,5,1,"Deadpool manages to free Alex with the help of Bob, Agent of Hydra.",0.98664790391922],["Agent X (Marvel Comics)","Outlaw (Marvel Comics)",5,5,5,"Outlaw returns in time to help fight Black Swan, who has absorbed Alex\u003cbr\u003eand Deadpool&#x27;s powers to augment himself.",0.995798647403717],["Ajak","Hercules (Marvel Comics)",2,2,1,"In the 2008 &quot;Secret Invasion&quot; storyline, Ajak joins\u003cbr\u003eHercules&#x27; &quot;God Squad&quot; to battle the Skrull gods, not\u003cbr\u003eonly to defend Earth, but to gain a greater understanding of the\u003cbr\u003eSkrulls.",0.9977089166641235],["Ajak","Ikaris",2,2,2,"Gilgamesh kills Makkari, sparking a conflict between Ikaris and Druig.",-0.97966068983078],["Ajak","Makkari (character)",2,2,2,"During this time Ajak breeds resentment towards Makkari for being the\u003cbr\u003eDreaming Celestial&#x27;s chosen communicator, warning the other\u003cbr\u003eEternals that the Dreaming Celestial is broken.",-0.9985405206680298],["Ajak","Thena",2,2,1,"Blaming the Eternals and Deviants for Margo&#x27;s death, Damian uses\u003cbr\u003eCelestial technology to transform Ajak into a monster and sends him to\u003cbr\u003ekill Donald and Deborah Ritter, the children of Kro and Thena.",-0.6459805965423584],["Anne Weying","Eddie Brock",3,3,4,"This version bonded to the Venom symbiote after Eddie Brock killed\u003cbr\u003ehimself before he could bond with Venom, with her rage and grief over\u003cbr\u003eBrock&#x27;s death attracting Venom to her.",0.9952355027198792],["Anne Weying","Spider-Man",3,3,5,"Weying commits suicide after spotting Spider-Man in an older black\u003cbr\u003ecostume at a time when his regular red and blue suit had been stolen.",-0.9991809725761414],["Anne Weying","Venom (character)",3,3,13,"With Spider-Man, Weying confronts Brock, who had become Venom and\u003cbr\u003ekidnapped Spider-Man&#x27;s parents Richard and Mary Parker.",0.9962612986564636],["Anole (character)","Cyclops (Marvel Comics)",1,1,2,"As a member of the New X-Men, Anole takes part in various missions\u003cbr\u003ewith the team, including the events leading up to X-Men: Messiah\u003cbr\u003eComplex and through to its conclusion when Cyclops officially closes\u003cbr\u003ethe school and disbands the X-Men.",0.9895231127738953],["Anole (character)","Emma Frost",1,1,1,"Shortly afterward, Emma Frost sets up an all-out brawl amongst the\u003cbr\u003eremaining students to determine who will become the new team of X-Men\u003cbr\u003etrainees (dubbed the New X-Men); Victor is not selected for the squad,\u003cbr\u003ebut remains at the school.",0.5348748564720154],["Anole (character)","Hellion (character)",1,1,2,"2 involved Anole committing suicide after coming out at Parent&#x27;s\u003cbr\u003eDay and being shunned by his parents and two closest friends, Joshua\u003cbr\u003eFoley (Elixir) and Julian Keller (Hellion), for his sexual\u003cbr\u003eorientation.",-0.99860018491745],["Anole (character)","Northstar (character)",1,1,16,"Northstar discovers Anole at his tree house, unhappy to see his former\u003cbr\u003ementor.",-0.9992357492446899],["Anole (character)","Rockslide (character)",1,1,9,"Rockslide apologizes, swearing that he did not know.",-0.9989680051803589],["Anya Corazon","Dusk (comics)",3,3,1,"She is later captured by Chilean soldiers who deliver her to the\u003cbr\u003ePuppet Master; she is added to a collection of female heroes that\u003cbr\u003eincludes Stature, Dusk, Tigra, and Silverclaw.",0.999165415763855],["Anya Corazon","Spider-Girl",3,3,22,"Using Spider-Girl&#x27;s body, Anya is able to get close to Black\u003cbr\u003eTarantula to kiss.",0.9992164373397827],["Anya Corazon","Spider-Man",3,3,14,"However, in a chance encounter, Spider-Man arrives and, after\u003cbr\u003ediscussing her origins and adventures, tells her, &quot;With great\u003cbr\u003epower comes great responsibility&quot; and that in every age, people\u003cbr\u003eare called to be heroes.",0.9996466636657715],["Anya Corazon","Spider-Man Noir",3,3,1,"They eventually discovered and teamed up with other Spider-powered\u003cbr\u003epeople (consisting of Spider-Woman, Spider-Ham, Spider-Man Noir, and\u003cbr\u003eSpider-Man of India), neither of whom remembered their previous\u003cbr\u003eencounter during the original Spider-Verse.",-0.9895706176757812],["Arabian Knight (character)","Sabra (character)",7,7,2,"He overcomes his dislike of Sabra to win their battle against She-\u003cbr\u003eHulk, Captain Britain, and Defensor.",0.9969841837882996],["Ares (Marvel Comics)","Hercules (Marvel Comics)",2,2,15,"Despite the combined attacks of the God Squad, Ares is unscathed and\u003cbr\u003eengages Hercules in direct combat as Zeus and Hera battle Galactus and\u003cbr\u003ethe other members of the Squad.",0.9994086027145386],["Balder the Brave","Hercules (Marvel Comics)",2,2,3,"In return, the newly restored and empowered Hercules fights and easily\u003cbr\u003ebests most of them, including Balder.",0.9995163679122925],["Battlestar (character)","Bucky (Marvel Comics)",6,6,10,"Thus, Bucky was black.",-0.9985659718513489],["Beta Ray Bill","Adam Warlock",2,2,1,"Bill also features in the storyline &quot;Blood and Thunder&quot;,\u003cbr\u003eattempting, alongside Adam Warlock, Thanos and others, to deal with\u003cbr\u003ethe &quot;warrior madness&quot; of Thor through which he is trying to\u003cbr\u003edestroy the universe, although at one point he is struck with enough\u003cbr\u003e[...]",0.9881935715675354],["Beta Ray Bill","Rom the Space Knight",2,2,1,"Bill remains on Earth, aiding the spaceknight Rom against the threat\u003cbr\u003eof the alien Dire Wraiths and foes such as Iron Man opponent Titanium\u003cbr\u003eMan.",0.9864879250526428],["Betsy Braddock","Anole (character)",1,1,1,"During this time, Betsy started focusing her powers into different\u003cbr\u003eweapons of psychic energy such as a bow and arrow, a crossbow and a\u003cbr\u003egrappling line and a flail, mentored a small group of students\u003cbr\u003econsisted of Hellion, Anole, Broo, and Rockslide and [...]",0.9898596405982971],["Betsy Braddock","Cable (character)",1,1,9,"Betsy&#x27;s posture in this mission impressed Cable.",0.9994691014289856],["Betsy Braddock","Cyclops (Marvel Comics)",1,1,13,"Betsy then joined the Blue Team led by Cyclops, for whom she displayed\u003cbr\u003ean obvious attraction.",0.9985156655311584],["Betsy Braddock","Doctor Nemesis",1,1,1,"While Cable recruited Fantomex, Marrow and Doctor Nemesis as his\u003cbr\u003eteammates, Betsy actually sought Cable because she couldn&#x27;t bear\u003cbr\u003estaying away from X-Force as she admitted she was addicted to killing.",0.950648844242096],["Betsy Braddock","Emma Frost",1,1,2,"After the war ended, Magneto&#x27;s team of X-Men disbanded and Betsy\u003cbr\u003elearned that he was working alongside Emma Frost and knew about her\u003cbr\u003edeceptions that led to the war.",0.993198037147522],["Betsy Braddock","Hellion (character)",1,1,1,"During this time, Betsy started focusing her powers into different\u003cbr\u003eweapons of psychic energy such as a bow and arrow, a crossbow and a\u003cbr\u003egrappling line and a flail, mentored a small group of students\u003cbr\u003econsisted of Hellion, Anole, Broo, and Rockslide and [...]",0.9898596405982971],["Betsy Braddock","Jean Grey",1,1,11,"During the &quot;Dark Angel Saga&quot;, Betsy&#x27;s full psionic\u003cbr\u003epotential was unlocked by Jean Grey from the Age of Apocalypse\u003cbr\u003etimeline.",0.9973077774047852],["Betsy Braddock","Jubilee (character)",1,1,5,"In this world, Betsy acted as a law enforcer for Department X\u003cbr\u003ealongside Iceman, Jubilee, Northstar, and Blob, with whom she\u003cbr\u003edeveloped a special friendship.",0.9993769526481628],["Betsy Braddock","Northstar (character)",1,1,1,"In this world, Betsy acted as a law enforcer for Department X\u003cbr\u003ealongside Iceman, Jubilee, Northstar, and Blob, with whom she\u003cbr\u003edeveloped a special friendship.",0.9993769526481628],["Betsy Braddock","Phoenix Force",1,1,5,"To keep the Shadow King imprisoned in the Astral Plane, Betsy\u003cbr\u003esacrificed the use of her telepathy, but at some point gained\u003cbr\u003ePhoenix&#x27;s telekinesis instead.",-0.9985413551330566],["Betsy Braddock","Puck (Marvel Comics)",1,1,1,"With the help of Storm and Puck, Betsy faced her longtime rival and\u003cbr\u003eBishop, who had returned to the present day.",0.9982845187187195],["Betsy Braddock","Rachel Summers",1,1,12,"Rachel Summers supported her psychically, and the two began a romantic\u003cbr\u003erelationship.",0.999565064907074],["Betsy Braddock","Rockslide (character)",1,1,1,"During this time, Betsy started focusing her powers into different\u003cbr\u003eweapons of psychic energy such as a bow and arrow, a crossbow and a\u003cbr\u003egrappling line and a flail, mentored a small group of students\u003cbr\u003econsisted of Hellion, Anole, Broo, and Rockslide and [...]",0.9898596405982971],["Betsy Braddock","Storm (Marvel Comics)",1,1,12,"Breaking into the United States Capitol, Betsy and Storm attempt to\u003cbr\u003ewarn Magneto of the possible apocalyptic future ahead of them, but he\u003cbr\u003escoffs at the idea and attempts to destroy another attacking squad of\u003cbr\u003eSentinels.",-0.9980996251106262],["Betsy Braddock","Surge (Marvel Comics)",1,1,1,"Later in Quebec, while stopping Nuklo from opening a nexus, teammate\u003cbr\u003eSurge sacrificed herself to seal the rift, deepening tensions within\u003cbr\u003ethe team.",-0.9217697381973267],["Betsy Braddock","Vulcan (Marvel Comics)",1,1,1,"Earth-98193: Captain Britain is briefly seen in an interview with\u003cbr\u003eVulcan as a member of the X-Men.",0.5718867778778076],["Betsy Braddock","Wolverine (character)",1,1,32,"Wolverine, though initially reluctant to involve outsiders in the\u003cbr\u003eX-Men&#x27;s affairs, was impressed by her bravery and nominated her\u003cbr\u003eto join the team.",0.9997692704200745],["Betsy Braddock","Xorn",1,1,1,"When Captain America and Hydra took over the United States, Betsy and\u003cbr\u003ea few mutants relocated to the mutant sovereign republic of New Tian,\u003cbr\u003eunder the leadership of Xorn, who was mind controlled by Emma Frost\u003cbr\u003ebehind the scenes.",0.9675717353820801],["Bill Foster (character)","Iron Fist (character)",0,0,1,"Under his Black Goliath identity, he appears briefly as part of an ad-\u003cbr\u003ehoc team of &quot;urban&quot; superheroes (Luke Cage, Iron Fist,\u003cbr\u003eBrother Voodoo, and Falcon).",0.9394606947898865],["Bill Foster (character)","Luke Cage",0,0,4,"Taking the name &quot;Black Goliath&quot;, he helps Power Man fight\u003cbr\u003ethe Circus of Crime.",0.9979391694068909],["Bill Foster (character)","Mockingbird (Marvel Comics)",0,0,1,"Mockingbird, Tigra, and Moon Knight answer his summons and join him in\u003cbr\u003edestroying the base.",-0.988041877746582],["Bill Foster (character)","Moon Knight",0,0,1,"Mockingbird, Tigra, and Moon Knight answer his summons and join him in\u003cbr\u003edestroying the base.",-0.988041877746582],["Black Bolt","Gorgon (Inhuman)",6,6,4,"Gorgon and other Inhumans are captured during the attack, which\u003cbr\u003eprompts Black Bolt to personally head a team to rescue his subjects\u003cbr\u003eand retrieve the crystals.",0.9964163303375244],["Black Bolt","Human Torch",6,6,2,"After being forced to intercede in the budding romance between his\u003cbr\u003ecousin Crystal and the Fantastic Four&#x27;s Johnny Storm, Black Bolt\u003cbr\u003eand the Inhumans feature in the title Amazing Adventures, and battle\u003cbr\u003evillains such as the Mandarin and Magneto.",0.999298095703125],["Black Bolt","Karnak (character)",6,6,2,"Black Bolt reappears in a story focusing on his cousin Medusa, drives\u003cbr\u003eoff the Hulk after he defeats the entire Inhuman Royal Family (Medusa,\u003cbr\u003eGorgon, Karnak, Triton, and Crystal), and with the Fantastic Four,\u003cbr\u003ebattles his brother Maximus and his own group [...]",0.99491947889328],["Black Bolt","Kristoff Vernard",6,6,1,"With the Royal Family, the Fantastic Four, and Doom&#x27;s heir\u003cbr\u003eKristoff Vernard, Black Bolt thwarts Morgan le Fay and Maximus again,\u003cbr\u003ebattling Thor and Sub-Mariner in the process.",0.9970297813415527],["Black Bolt","Quicksilver (Marvel Comics)",6,6,6,"Black Bolt settles a quarrel between Johnny Storm and the mutant\u003cbr\u003eQuicksilver for the affections of Crystal, and frees the slave caste\u003cbr\u003eof Inhuman society, the Alpha Primitives.",0.9969980716705322],["Black Cat (Marvel Comics)","Mayday Parker",3,3,2,"This version is Spider-Man&#x27;s primary love interest, and the\u003cbr\u003emother of their daughter Felicity Hardy \u002f Spider-Girl, who inherited\u003cbr\u003eher father&#x27;s spider-powers and her mother&#x27;s white hair (cut\u003cbr\u003eshort), helping the Next Avengers survive Ultron&#x27;s rule along\u003cbr\u003e[...]",0.9929893016815186],["Black Cat (Marvel Comics)","Paladin (comics)",3,3,1,"Felicia later inadvertently reveals his identity to an informant and\u003cbr\u003ebecomes jealous of Parker&#x27;s continued friendship with Mary Jane\u003cbr\u003ebefore Felicia is killed by Paladin.",-0.9859937429428101],["Black Cat (Marvel Comics)","Scarlet Spider",3,3,1,"This version is a detective who was formerly married to Flash\u003cbr\u003eThompson, whose daughter Felicity Hardy (who suspects Spider-Man to be\u003cbr\u003eher real father, and in-turn Spider-Girl to be her half-sister)\u003cbr\u003ebecomes the Scarlet Spider.",0.981205940246582],["Black Cat (Marvel Comics)","Spider-Man",3,3,24,"Hardy is a talented photographer; while dating Spider-Man she takes\u003cbr\u003epictures of the hero that he admits are better than his own work.",0.9995960593223572],["Black Cat (Marvel Comics)","Spider-Man Noir",3,3,1,"This version is the primary love interest of Spider-Man Noir and the\u003cbr\u003eowner of &quot;The Black Cat&quot;, a speakeasy that caters to the\u003cbr\u003emost powerful and corrupt in New York City, who later becomes the\u003cbr\u003eWhite Widow.",0.99628746509552],["Black Cat (Marvel Comics)","Spider-Woman (Jessica Drew)",3,3,5,"On the bottom of the letters page of The Amazing Spider-Man #194 (July\u003cbr\u003e1979), a thumbnail of the intended cover for Spider-Woman #9 (December\u003cbr\u003e1978) appears along with a rejected cover for The Amazing Spider-Man\u003cbr\u003e#194.",-0.9970260262489319],["Black Jack Tarr","Shang-Chi",0,0,10,"After Leiko Wu is murdered in London&#x27;s Chinatown while on an\u003cbr\u003eundercover mission to infiltrate the triads, Tarr reunites with Shang-\u003cbr\u003eChi, who has come to London to investigate Leiko&#x27;s death.",0.9983641505241394],["Black Marvel","Spider-Man",3,3,2,"Daniel Lyons and an original incarnation named Omar Mosely appeared in\u003cbr\u003eSpider-Man: The Animated Series, with the latter voiced by Paul\u003cbr\u003eWinfield.",0.9879702925682068],["Black Panther (character)","Bill Foster (character)",0,0,1,"Soon after Black Panther was introduced, Marvel added two more\u003cbr\u003erecurring black characters: Jill Jerrold in Modeling with Millie, and\u003cbr\u003eBill Foster in The Avengers.",0.9928267002105713],["Black Panther (character)","Luke Cage",0,0,4,"This series introduces a new version of The Crew, now including Storm,\u003cbr\u003eLuke Cage, Misty Knight, and Manifold.",0.9994040727615356],["Black Panther (character)","Misty Knight",0,0,2,"This series introduces a new version of The Crew, now including Storm,\u003cbr\u003eLuke Cage, Misty Knight, and Manifold.",0.9994040727615356],["Black Panther (character)","White Tiger (comics)",0,0,2,"This Black Panther, who became the White Tiger, was placed in the\u003cbr\u003eseries The Crew, running concurrently with the final few Black Panther\u003cbr\u003eissues.",0.9928250312805176],["Black Rider (character)","Kid Colt",0,0,1,"Other company characters, like Kid Colt and Arrowhead also made\u003cbr\u003eappearances.",0.9814685583114624],["Black Rider (character)","Tarantula (Marvel Comics)",0,0,1,"A modern-day version of the character stars in the five-issue ensemble\u003cbr\u003eminiseries Six Guns (#1-4 cover-dated January\u2013March 2012), by writer\u003cbr\u003eAndy Diggle and artist Davide Gianfelice, and also starring the extant\u003cbr\u003efemale mercenary Tarantula and new [...]",0.9933451414108276],["Black Rider (character)","Two-Gun Kid",0,0,1,"the Western Kid; Matt Slade; and the Two-Gun Kid.",0.5425569415092468],["Black Widow (Natasha Romanova)","Red Guardian",0,0,2,"The character&#x27;s backstory was expanded in Avengers #43 (1967),\u003cbr\u003ewhen she discovered that the secret identity of the Red Guardian was\u003cbr\u003eher husband Alexei, who had been presumed dead.",0.9537264704704285],["Black Widow (Natasha Romanova)","Yelena Belova",0,0,4,"Black Widow finds a counterpart and rival in Yelena Belova, another\u003cbr\u003eBlack Widow.",0.9961567521095276],["Blackwulf","Deathlok",4,4,3,"Lucian asks Deathlok to join the Underground Legion, but Deathlok\u003cbr\u003ereplies that he had to sort himself out first before he could be of\u003cbr\u003euse to anyone.",-0.9986224174499512],["Blackwulf","Hank Pym",4,4,2,"Blackwulf joins the Underground Legion and Giant-Man in following\u003cbr\u003eSparrow to Ottsville, Pennsylvania, where she had gone missing while\u003cbr\u003eon assignment.",-0.9742014408111572],["Blade (character)","Doctor Strange",5,5,5,"In later y Andi\u003cbr\u003eBenton.",0.9955930113792419],["Anole (character)","Hulkling",1,6,1,"His sexual orientation continued to be mentioned indirectly, and other\u003cbr\u003eallusions included him pointing out that Young Avengers characters\u003cbr\u003eWiccan and Hulkling are gay before being cut off, and Anole attacking\u003cbr\u003eRockslide for calling him a &quot;sissy,&quot; Rockslide [...]",-0.9639371633529663],["Anya Corazon","Machine Man",3,4,1,"During a battle with Ms. Marvel&#x27;s team, Anya is partially subdued\u003cbr\u003eby Machine Man and Sleepwalker, and resists the Puppet Master&#x27;s\u003cbr\u003ecommand that she kill Ms. Marvel whom she sees as a mother figure.",-0.9672812223434448],["Anya Corazon","Ms. Marvel",3,2,9,"Gil is proud to let her train with Ms. Marvel and Wonder Man.",0.9998683929443359],["Anya Corazon","Power Man (Victor Alvarez)",3,0,1,"During the Fear Itself storyline, Anya, X-23, Amadeus Cho, Power Man,\u003cbr\u003eand Thunderstrike are teleported to a station in the middle of the\u003cbr\u003ePacific Ocean where they fight samurai Shark Men.",0.8228229284286499],["Anya Corazon","Rikki Barnes",3,6,1,"Anya (still known as Ara\u00f1a) was next seen teaming up with the new\u003cbr\u003eNomad (Rikki Barnes) to investigate the Secret Empire.",0.8330314755439758],["Arabian Knight (character)","Hulk",7,4,1,"When the demons are freed by an archeologist, Abdul finds his\u003cbr\u003eancestor&#x27;s magical equipment inside the tomb and becomes the\u003cbr\u003eArabian Knight, sealing away the demons with help from the Hulk.",0.9935911893844604],["Arabian Knight (character)","Machine Man",7,4,3,"During Red Hulk and Machine Man&#x27;s fight with Sultan Magus,\u003cbr\u003eArabian Knight gets free and helps in the fight against Sultan Magus.",0.9980337023735046],["Arabian Knight (character)","She-Hulk",7,4,1,"He overcomes his dislike of Sabra to win their battle against She-\u003cbr\u003eHulk, Captain Britain, and Defensor.",0.9969841837882996
