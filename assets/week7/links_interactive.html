PKvtO6Px8cWBR5sbg\u002f"},"type":"scatter"},{"customdata":[["Abomination (character)","Hulk",4,4,45,"The Hulk, however, throws the Abomination into toxic waste\u003cbr\u003ethat partially dissolves and horribly scars the Abomination.",-0.9993584752082825],["Abomination (character)","Kristoff Vernard",4,6,1,"During the &quot;One World Under Doom&quot; storyline, a\u003cbr\u003epossible future version of Abomination appears as a member\u003cbr\u003eof the Superior Avengers until he is killed by Kristoff\u003cbr\u003eVernard.",-0.9776440262794495],["Abomination (character)","She-Hulk",4,4,4,"The Abomination is eventually driven off when set on fire by\u003cbr\u003ethe She-Hulk.",-0.9983068704605103],["Adam Warlock","Genis-Vell",2,2,1,"He is defeated by Genis-Vell and reverts to an ethereal\u003cbr\u003eentity.",-0.8930049538612366],["Adam Warlock","Gladiator (Kallark)",2,1,1,"The Shi&#x27;ar, led by Gladiator (also looking for the\u003cbr\u003epower source), appear and Annihilus, now with the power of\u003cbr\u003ethe Hulk and a new fear projection ability, defeats them.",-0.996742308139801],["Adam Warlock","Hulk",2,4,3,"The Shi&#x27;ar, led by Gladiator (also looking for the\u003cbr\u003epower source), appear and Annihilus, now with the power of\u003cbr\u003ethe Hulk and a new fear projection ability, defeats them.",-0.996742308139801],["Adam Warlock","Star-Lord",2,2,6,"After time resumes, Star-Lord notices that Gamora is gone as\u003cbr\u003eAdam sent her to a location so that she can redeem herself.",-0.999559223651886],["Agent X (Marvel Comics)","Cable (character)",5,1,3,"As part of the same effort, Cable was changed to Soldier X\u003cbr\u003eand X-Force to X-Statix.",-0.9941638112068176],["Ajak","Ikaris",2,2,2,"Gilgamesh kills Makkari, sparking a conflict between Ikaris\u003cbr\u003eand Druig.",-0.97966068983078],["Ajak","Makkari (character)",2,2,2,"During this time Ajak breeds resentment towards Makkari for\u003cbr\u003ebeing the Dreaming Celestial&#x27;s chosen
